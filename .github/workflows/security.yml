name: Security checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          # gitleaks-action v2 requires a token to enumerate pull request commits.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Findings are reported in the job log; commenting would need pull-requests: write.
          GITLEAKS_ENABLE_COMMENTS: false
